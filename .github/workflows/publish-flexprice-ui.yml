name: Publish flexprice-ui

# Publishes the exportable UI package (@flexprice/flexprice-ui) to npm.
# Runs on every push to main (and can be run manually). It only publishes when the version in
# packages/flexprice-ui/package.json is new — so bump that version in your PR to release; pushes
# that don't change the version just run the checks and skip publishing.
#
# Required repository secret: NPM_TOKEN (an npm automation token for the @flexprice org).

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: publish-flexprice-ui
  cancel-in-progress: false

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npx vitest run

      - name: Build package
        run: npm run build:ui

      - name: Publish to npm (only if version is new)
        working-directory: packages/flexprice-ui
        run: |
          NAME=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VER" version >/dev/null 2>&1; then
            echo "$NAME@$VER is already published — skipping."
          else
            npm publish --provenance --access public
            echo "Published $NAME@$VER"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
